<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Hammurabi Handoff — social hero banner (1200x630). Brand bg #0b0e14,
       stone #2a2a3e, gold #c9a96e. Logo geometry mirrors assets/logo.svg. -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33334a"/>
      <stop offset="0.5" stop-color="#2a2a3e"/>
      <stop offset="1" stop-color="#222234"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcbf87"/>
      <stop offset="1" stop-color="#c9a96e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#141926"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Centered logo, scaled ~0.42 from the 512 stele, upper third -->
  <g transform="translate(492 24) scale(0.42)">
    <path d="M116 468 L116 190 Q116 44 256 44 Q396 44 396 190 L396 468 Z"
          fill="url(#stone)" stroke="#1a1a2a" stroke-width="6"/>
    <path d="M132 462 L132 192 Q132 60 256 60 Q380 60 380 192 L380 462"
          fill="none" stroke="#3d3d58" stroke-width="3"/>
    <g stroke="#3d3d58" stroke-width="5" stroke-linecap="round" opacity="0.8">
      <path d="M170 110 l20 0"/><path d="M205 96 l0 20"/><path d="M320 100 l18 10"/>
      <path d="M232 128 l16 0"/><path d="M290 124 l0 18"/><path d="M348 140 l16 0"/>
      <path d="M168 152 l0 18"/><path d="M256 156 l18 8"/>
    </g>
    <g fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 268 L216 268 L262 306"/>
      <path d="M362 244 L296 244 L250 282"/>
      <path d="M238 296 L258 276 L278 296"/>
      <path d="M234 268 L254 288 L274 268"/>
    </g>
    <g fill="none" stroke="#c9a96e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="M212 356 L184 384 L212 412"/>
      <path d="M300 356 L328 384 L300 412"/>
      <path d="M268 352 L244 416"/>
    </g>
  </g>

  <!-- Tagline -->
  <text x="600" y="356" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="58" fill="url(#gold)" letter-spacing="1">Hammurabi Handoff</text>
  <text x="600" y="418" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400"
        font-size="38" fill="#e6e8ee" letter-spacing="2">Zero-Telemetry &#183; 1Shot Settlement</text>

  <!-- Thin gold divider -->
  <rect x="470" y="470" width="260" height="2" fill="#c9a96e" opacity="0.5"/>

  <!-- Sign-off -->
  <text x="600" y="560" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="24" fill="#8a8f9c" letter-spacing="1">Keep the faith, the good exists.</text>
</svg>
