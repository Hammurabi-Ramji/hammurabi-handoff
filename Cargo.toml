[workspace]
resolver = "2"
members = [
    "core/iedb-crypto",
    "tooling/iedb-oka",
    "desktop/hammurabi-handoff",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Hammurabi Coding Company, LLC"]
license = "MIT"
repository = "https://github.com/Hammurabi-Ramji/hammurabi-handoff"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full", "tracing"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "json", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
ulid = { version = "1.1", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
zeroize = "1"
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
curve25519-dalek = "4"
crypto_box = { version = "0.9", features = ["chacha20"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
